org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom no se lleva bien con el configuration cache; Create Fly tambien lo desactiva.
org.gradle.configuration-cache=false

# JDK 25 explicito para este proyecto, para no tocar el JAVA_HOME del sistema (sigue en 21).
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-25.0.4.7-hotspot


plugins {
    id 'idea'
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fly"
}

loom {
    // SIN splitEnvironmentSourceSets(): un solo source set, como la version NeoForge.
    // Partir el proyecto obligaria a operar 49 archivos mixtos (BlockEntities con metodos de
    // render inline, etc). Con un source set unico el jar entero de Create Fly --main y client--
    // queda en el classpath, y el aislamiento de entorno se mantiene como ya lo hacia el mod:
    // @Environment(EnvType.CLIENT) y el config de mixins de cliente aparte.
    accessWidenerPath = file("src/main/resources/create_connected.classtweaker")

    mods {
        "create_connected" {
            sourceSet sourceSets.main
        }
    }
}

// Integraciones con mods que todavia no existen en 26.2. El codigo se conserva en el repo
// --no se borra-- para reactivarlo cuando cada mod se portee; solo se saca del compilado.
sourceSets.main.java {
    exclude 'com/hlysine/create_connected/compat/AdditionalPlacementsCompat.java'  // Additional Placements
    exclude 'com/hlysine/create_connected/compat/CopycatsManager.java'             // Copycats+
    exclude 'com/hlysine/create_connected/compat/DyeDepotCompat.java'              // Dye Depot
    exclude 'com/hlysine/create_connected/compat/SimCompatRegistry.java'           // Simulated
    exclude 'com/hlysine/create_connected/compat/CreateConnectedJEI.java'          // JEI
    // Solo existe para avisarle a JEI que refresque su lista al cambiar un feature toggle, y
    // ademas colgaba del event bus de NeoForge. Vuelve con JEI.
    exclude 'com/hlysine/create_connected/compat/FeatureRefreshEvent.java'         // JEI
    exclude 'com/hlysine/create_connected/mixin/compat/**'

    // Mixins cuyo target no existe en 26.2:
    // ThrottleLeverBlock es del mod Simulated (dev.simulated_team.simulated), no de Create.
    exclude 'com/hlysine/create_connected/mixin/linkedtransmitter/ThrottleLeverBlockMixin.java'
    // El throttle lever vinculado extiende el bloque de Simulated y solo lo registra
    // SimCompatRegistry, que ya esta excluido.
    exclude 'com/hlysine/create_connected/content/linkedtransmitter/LinkedThrottleLever*.java'
    // La pantalla de config de catnip no fue porteada: Create Fly tiene catnip.config pero no
    // catnip.config.ui. Consecuencia: no hay UI in-game para los feature toggles; se editan por
    // archivo. Restaurar si catnip.config.ui aparece.
    exclude 'com/hlysine/create_connected/mixin/featuretoggle/SubMenuConfigScreenMixin.java'
    // Create Fly no tiene ItemUseOverrides; el mecanismo completo desaparecio, no fue renombrado.
    // Ver PreciseItemUseOverrides para la consecuencia de comportamiento.
    exclude 'com/hlysine/create_connected/mixin/ItemUseOverridesMixin.java'
    // MountedStorageManager.readLegacy no existe en Create Fly: la lectura del formato viejo de
    // storage en contraptions se elimino entera, no se renombro (javap sobre MountedStorageManager
    // solo tiene read(ValueInput,...) y read(DynamicOps,...)). Sin ese metodo no hay donde
    // inyectar, y como Create Fly tampoco lee ese formato, no habria datos que migrar igual.
    // Consecuencia: los silos que viajaban en una contraption de un mundo 1.21.1 no se recuperan.
    exclude 'com/hlysine/create_connected/mixin/itemsilo/MountedStorageManagerMixin.java'

    // Generadores de blockstates/modelos. Quedaron sin referencias al sacar el datagen de las
    // cadenas de registro; se conservan por si algun dia se regeneran los JSON contra 26.2.
    exclude 'com/hlysine/create_connected/datagen/CCBlockStateGen.java'
    exclude 'com/hlysine/create_connected/datagen/CCDatagen.java'
    // CCAdvancement NO va aca aunque viva bajo datagen/: awardTo/isAlreadyAwardedTo son runtime, y
    // registra los triggers "<id>_builtin" que los JSON de avances ya committeados nombran como su
    // criterio. Excluirlo deja los avances sin poder dispararse, sin error de compilacion.
    // Generadores de blockstate/modelo por feature. Quedaron sin referencias al sacar el datagen
    // de las cadenas de registro.
    exclude 'com/hlysine/create_connected/content/fluidvessel/FluidVesselGenerator.java'
    exclude 'com/hlysine/create_connected/content/inventoryaccessport/InventoryAccessPortGenerator.java'
    exclude 'com/hlysine/create_connected/content/kineticbattery/KineticBatteryGenerator.java'
}

// Los 1025 JSONs que Registrate genero en 1.21.1. Se conservan y se migran a los
// formatos de 26.2 a mano (tarea #8) en vez de regenerarlos: Create Fly no tiene
// Registrate, asi que no hay datagen equivalente que los vuelva a producir.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Curse Maven"
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"

    // The fabric-api artifact is a container: 53 nested jars, zero classes of its own. Depending on
    // it as plain `implementation` puts nothing on the compile classpath, and the symptom is a
    // package-does-not-exist on every fabric.api import -- not a missing-jar error. Loom's
    // modImplementation would have unpacked it, but the mod* configurations no longer exist here
    // (see the Create Fly note below), so the modules we actually use are named individually.
    // Note the artifact names do not match the packages: `net.fabricmc.fabric.api.itemgroup.v1`
    // ships in fabric-creative-tab-api-v1.
    implementation fabricApi.module("fabric-creative-tab-api-v1", fabric_version)
    implementation fabricApi.module("fabric-lifecycle-events-v1", fabric_version)
    implementation fabricApi.module("fabric-networking-api-v1", fabric_version)
    implementation fabricApi.module("fabric-object-builder-api-v1", fabric_version)
    implementation fabricApi.module("fabric-resource-conditions-api-v1", fabric_version)
    implementation fabricApi.module("fabric-model-loading-api-v1", fabric_version)
    implementation fabricApi.module("fabric-renderer-api-v1", fabric_version)
    implementation fabricApi.module("fabric-rendering-v1", fabric_version)
    // Still needed at runtime for the rest of the API, and for the JiJ metadata.
    runtimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Create Fly. Trae Flywheel, Ponder y Catnip embebidos, por eso no van por separado.
    // Va con `implementation` y no `modImplementation`: en Loom 1.16 / MC 26.2 el
    // namespace de produccion ya es mojmap, no hay paso de remapeo y las
    // configuraciones mod* no existen. Create Fly declara sus deps de mods igual.
    implementation "maven.modrinth:create-fly:${create_fly_version}"
}

processResources {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version: minecraft_version,
            loader_version   : loader_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    // Durante el port necesitamos la lista COMPLETA de errores como worklist,
    // no los primeros 100 que javac muestra por defecto.
    options.compilerArgs << '-Xmaxerrs' << '10000' << '-Xmaxwarns' << '10000'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

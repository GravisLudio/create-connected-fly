plugins {
    id 'idea'
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fly"
}

loom {
    // SIN splitEnvironmentSourceSets(): un solo source set, como la version NeoForge.
    // Partir el proyecto obligaria a operar 49 archivos mixtos (BlockEntities con metodos de
    // render inline, etc). Con un source set unico el jar entero de Create Fly --main y client--
    // queda en el classpath, y el aislamiento de entorno se mantiene como ya lo hacia el mod:
    // @Environment(EnvType.CLIENT) y el config de mixins de cliente aparte.
    accessWidenerPath = file("src/main/resources/create_connected.classtweaker")

    mods {
        "create_connected" {
            sourceSet sourceSets.main
        }
    }
}

// Los 1025 JSONs que Registrate genero en 1.21.1. Se conservan y se migran a los
// formatos de 26.2 a mano (tarea #8) en vez de regenerarlos: Create Fly no tiene
// Registrate, asi que no hay datagen equivalente que los vuelva a producir.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Curse Maven"
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Create Fly. Trae Flywheel, Ponder y Catnip embebidos, por eso no van por separado.
    // Va con `implementation` y no `modImplementation`: en Loom 1.16 / MC 26.2 el
    // namespace de produccion ya es mojmap, no hay paso de remapeo y las
    // configuraciones mod* no existen. Create Fly declara sus deps de mods igual.
    implementation "maven.modrinth:create-fly:${create_fly_version}"
}

processResources {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version: minecraft_version,
            loader_version   : loader_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    // Durante el port necesitamos la lista COMPLETA de errores como worklist,
    // no los primeros 100 que javac muestra por defecto.
    options.compilerArgs << '-Xmaxerrs' << '10000' << '-Xmaxwarns' << '10000'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
